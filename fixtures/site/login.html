<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Fixture 登录</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 420px; }
    label { display: block; margin-top: 0.75rem; }
    input { width: 100%; padding: 0.4rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    .err { color: #b00020; display: none; }
  </style>
</head>
<body>
  <h1>Fixture 登录</h1>
  <form id="loginForm" action="table.html" method="get">
    <label>账号 <input id="user" name="user" type="text" placeholder="demo" /></label>
    <label>密码 <input id="pwd" name="pwd" type="password" placeholder="••••" /></label>
    <label>验证码 <input id="captcha" name="captcha" type="text" placeholder="可选" /></label>
    <button type="submit" id="loginBtn">登 录</button>
  </form>
  <p class="err" id="err">账号或密码错误（fixture 任意非空即可）</p>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      var u = document.getElementById('user').value.trim();
      var p = document.getElementById('pwd').value;
      if (!u || !p) {
        e.preventDefault();
        document.getElementById('err').style.display = 'block';
      }
    });
  </script>
</body>
</html>
