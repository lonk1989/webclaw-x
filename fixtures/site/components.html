<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Component Pack Fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 900px; }
    .row { margin: 1.25rem 0; padding: 1rem; border: 1px solid #e5e5e5; border-radius: 6px; }
    label { margin-right: 0.5rem; color: #606266; }
    /* Element-ish date range */
    .el-date-editor.el-range-editor {
      display: inline-flex; align-items: center; border: 1px solid #dcdfe6;
      border-radius: 4px; padding: 0 8px; height: 32px;
    }
    .el-range-input { border: 0; width: 120px; outline: none; font-size: 13px; }
    .el-range-separator { padding: 0 6px; color: #303133; }
    /* Element-ish select */
    .el-select { position: relative; display: inline-block; min-width: 180px; }
    .el-select .el-input__inner {
      width: 100%; height: 32px; border: 1px solid #dcdfe6; border-radius: 4px;
      padding: 0 30px 0 12px; box-sizing: border-box;
    }
    .el-select-dropdown {
      display: none; position: absolute; left: 0; right: 0; top: 36px;
      border: 1px solid #e4e7ed; background: #fff; z-index: 10;
      box-shadow: 0 2px 12px rgba(0,0,0,.1);
    }
    .el-select.open .el-select-dropdown { display: block; }
    .el-select-dropdown__item {
      padding: 8px 12px; cursor: pointer; list-style: none;
    }
    .el-select-dropdown__item:hover,
    .el-select-dropdown__item.selected { background: #f5f7fa; color: #409eff; }
    /* Element-ish pagination */
    .el-pagination { display: flex; gap: 6px; align-items: center; margin-top: 0.75rem; }
    .el-pagination button, .el-pagination .number {
      min-width: 32px; height: 28px; border: 1px solid #dcdfe6; background: #fff;
      border-radius: 2px; cursor: pointer;
    }
    .el-pagination .number.active { color: #409eff; border-color: #409eff; }
    table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
    th, td { border: 1px solid #ebeef5; padding: 6px 8px; text-align: left; }
    th { background: #f5f7fa; }
    #log { margin-top: 1rem; background: #f7f7f7; padding: 0.75rem; white-space: pre-wrap; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Component Pack Fixture</h1>
  <p>模拟 Element 风格：日期范围 / 下拉 / 分页。带 <code>data-webclaw-comp</code> 供适配器稳定定位。</p>

  <div class="row">
    <h2>日期范围</h2>
    <div class="el-date-editor el-range-editor" data-webclaw-comp="date-range" data-webclaw-label="创建时间">
      <input class="el-range-input" data-webclaw-role="start" placeholder="开始日期" readonly />
      <span class="el-range-separator">至</span>
      <input class="el-range-input" data-webclaw-role="end" placeholder="结束日期" readonly />
    </div>
  </div>

  <div class="row">
    <h2>状态下拉</h2>
    <div class="el-select" data-webclaw-comp="select" data-webclaw-label="状态">
      <input class="el-input__inner" data-webclaw-role="trigger" readonly placeholder="请选择" value="" />
      <div class="el-select-dropdown" data-webclaw-role="dropdown">
        <div class="el-select-dropdown__item" data-value="全部">全部</div>
        <div class="el-select-dropdown__item" data-value="进行中">进行中</div>
        <div class="el-select-dropdown__item" data-value="已完成">已完成</div>
        <div class="el-select-dropdown__item" data-value="已关闭">已关闭</div>
      </div>
    </div>
  </div>

  <div class="row">
    <h2>表格分页</h2>
    <table>
      <thead><tr><th>单号</th><th>状态</th><th>日期</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="el-pagination" data-webclaw-comp="pager" data-page="1" data-pages="3">
      <button type="button" class="btn-prev" data-webclaw-role="prev">上一页</button>
      <button type="button" class="number" data-page="1">1</button>
      <button type="button" class="number" data-page="2">2</button>
      <button type="button" class="number" data-page="3">3</button>
      <button type="button" class="btn-next" data-webclaw-role="next">下一页</button>
      <span id="pageLabel">第 1 / 3 页</span>
    </div>
  </div>

  <div id="log">ready</div>

  <script>
    const ALL = [
      { id: 'A-001', status: '进行中', date: '2026-01-10' },
      { id: 'A-002', status: '已完成', date: '2026-02-11' },
      { id: 'A-003', status: '已关闭', date: '2026-03-12' },
      { id: 'B-001', status: '进行中', date: '2026-04-13' },
      { id: 'B-002', status: '已完成', date: '2026-05-14' },
      { id: 'B-003', status: '已完成', date: '2026-06-15' },
      { id: 'C-001', status: '全部', date: '2026-07-16' },
      { id: 'C-002', status: '进行中', date: '2026-08-17' },
      { id: 'C-003', status: '已关闭', date: '2026-09-18' },
    ];
    const state = { start: '', end: '', status: '', page: 1, pages: 3 };

    function log(msg) {
      document.getElementById('log').textContent = msg + ' @ ' + new Date().toISOString();
    }

    function render() {
      const start = (state.page - 1) * 3;
      const rows = ALL.slice(start, start + 3);
      document.getElementById('tbody').innerHTML = rows.map(r =>
        '<tr><td>' + r.id + '</td><td>' + r.status + '</td><td>' + r.date + '</td></tr>'
      ).join('');
      const pager = document.querySelector('[data-webclaw-comp="pager"]');
      pager.dataset.page = String(state.page);
      document.getElementById('pageLabel').textContent = '第 ' + state.page + ' / ' + state.pages + ' 页';
      pager.querySelectorAll('.number').forEach(btn => {
        btn.classList.toggle('active', Number(btn.dataset.page) === state.page);
      });
    }

    // Date range: click input to "pick" — adapter may also set value directly
    document.querySelectorAll('[data-webclaw-comp="date-range"] input').forEach(inp => {
      inp.addEventListener('click', () => { inp.readOnly = false; inp.focus(); });
      inp.addEventListener('change', () => {
        const root = document.querySelector('[data-webclaw-comp="date-range"]');
        state.start = root.querySelector('[data-webclaw-role="start"]').value;
        state.end = root.querySelector('[data-webclaw-role="end"]').value;
        log('date-range=' + state.start + '~' + state.end);
      });
      inp.addEventListener('input', () => {
        const root = document.querySelector('[data-webclaw-comp="date-range"]');
        state.start = root.querySelector('[data-webclaw-role="start"]').value;
        state.end = root.querySelector('[data-webclaw-role="end"]').value;
        log('date-range=' + state.start + '~' + state.end);
      });
    });

    // Select
    const selectRoot = document.querySelector('[data-webclaw-comp="select"]');
    const trigger = selectRoot.querySelector('[data-webclaw-role="trigger"]');
    trigger.addEventListener('click', () => selectRoot.classList.toggle('open'));
    selectRoot.querySelectorAll('.el-select-dropdown__item').forEach(item => {
      item.addEventListener('click', () => {
        const v = item.getAttribute('data-value') || item.textContent.trim();
        trigger.value = v;
        state.status = v;
        selectRoot.classList.remove('open');
        selectRoot.querySelectorAll('.el-select-dropdown__item').forEach(i => i.classList.remove('selected'));
        item.classList.add('selected');
        log('select=' + v);
      });
    });
    document.addEventListener('click', (e) => {
      if (!selectRoot.contains(e.target)) selectRoot.classList.remove('open');
    });

    // Pager
    const pager = document.querySelector('[data-webclaw-comp="pager"]');
    pager.querySelector('[data-webclaw-role="prev"]').addEventListener('click', () => {
      if (state.page > 1) { state.page -= 1; render(); log('page=' + state.page); }
    });
    pager.querySelector('[data-webclaw-role="next"]').addEventListener('click', () => {
      if (state.page < state.pages) { state.page += 1; render(); log('page=' + state.page); }
    });
    pager.querySelectorAll('.number').forEach(btn => {
      btn.addEventListener('click', () => {
        state.page = Number(btn.dataset.page);
        render();
        log('page=' + state.page);
      });
    });

    render();
  </script>
</body>
</html>
