name: release

# Ported from lonk1989/webclaw-oss (.github/workflows/release.yml), adapted for
# webclaw-x monorepo (workspace root) and Linux x64 asset. No npm publish.
#
# Trigger: push tag v*  OR  Actions → release → Run workflow (attach to a tag).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach assets to (e.g. v0.2.1). Leave empty when running on a tag push."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release-lite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: webclaw-lite-windows-x64.exe
            binary: target/release/webclaw-lite.exe
          - os: macos-latest
            asset: webclaw-lite-macos-arm64
            binary: target/release/webclaw-lite
          # ubuntu-24.04: ort/onnxruntime prebuilts need glibc≥2.38 + newer libstdc++
          # (__isoc23_strtol / _M_replace_cold). ubuntu-22.04 (glibc 2.35) fails at link.
          - os: ubuntu-24.04
            asset: webclaw-lite-linux-x64
            binary: target/release/webclaw-lite
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential

      - uses: dtolnay/rust-toolchain@stable

      - name: Build webclaw-lite
        run: cargo build --release -p webclaw --bin webclaw-lite

      - name: Stage asset + SHA256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "${{ matrix.binary }}" "${{ matrix.asset }}"
          Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256 |
            ForEach-Object { $_.Hash.ToLower() + "  ${{ matrix.asset }}" } |
            Set-Content "${{ matrix.asset }}.sha256" -NoNewline

      - name: Stage asset + SHA256 (Unix)
        if: runner.os != 'Windows'
        run: |
          cp "${{ matrix.binary }}" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" | awk '{print tolower($1) "  ${{ matrix.asset }}"}' | tr -d '\n' > "${{ matrix.asset }}.sha256"

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          generate_release_notes: ${{ inputs.tag == '' && startsWith(github.ref, 'refs/tags/v') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Slim MCP host zip for end-user installers (no Rust tree).
  release-host:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Stage webclaw-x-host.zip
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          mkdir -p "$stage"
          cp -a webclaw_x "$stage/"
          cp -a pyproject.toml requirements.txt README.md LICENSE "$stage/" 2>/dev/null || true
          cp -a docs/workbuddy-quickstart.md "$stage/WORKBUDDY.txt" 2>/dev/null || true
          (cd "$stage" && zip -r "$GITHUB_WORKSPACE/webclaw-x-host.zip" .)
          sha256sum webclaw-x-host.zip | awk '{print tolower($1) "  webclaw-x-host.zip"}' | tr -d '\n' > webclaw-x-host.zip.sha256
          ls -la webclaw-x-host.zip webclaw-x-host.zip.sha256

      - name: Upload host zip to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          files: |
            webclaw-x-host.zip
            webclaw-x-host.zip.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
