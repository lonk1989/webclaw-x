name: ci

# Smoke-build webclaw-lite on Win / macOS arm64 / Linux. Artifacts are CI-only
# (not attached to Releases). Release uploads live in release.yml on tags.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  rust-lite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: webclaw-lite-windows-x64
            binary: target/release/webclaw-lite.exe
          - os: macos-latest
            artifact: webclaw-lite-macos-arm64
            binary: target/release/webclaw-lite
          - os: ubuntu-22.04
            artifact: webclaw-lite-linux-x64
            binary: target/release/webclaw-lite
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build webclaw-lite
        run: cargo build --release -p webclaw --bin webclaw-lite

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
